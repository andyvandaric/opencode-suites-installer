name: Release Notes Guard

on:
  pull_request:
    branches: [main]

jobs:
  changelog-required:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure installer-impacting changes update changelog
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq '^(install\.sh|install\.ps1|README\.md|\.github/workflows/installer-smoke\.yml)$'; then
            if ! echo "$CHANGED" | grep -Eq '^CHANGELOG\.md$'; then
              echo "CHANGELOG.md must be updated when installer behavior/docs change."
              exit 1
            fi
          fi

      - name: Validate changelog has a top release header
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md is missing"
            exit 1
          fi

          header="$(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+ - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md | head -1 || true)"
          if [[ -z "$header" ]]; then
            echo "CHANGELOG.md must start with a semver-date header (example: ## 2.0.14 - 2026-03-07)."
            exit 1
          fi
